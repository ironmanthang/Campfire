name: Release Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        working-directory: desktop
        run: pnpm run build

      - name: Build Tauri release
        working-directory: desktop
        run: pnpm run release

      - name: Upload release artifacts
        # Create or update a GitHub Release for this tag and upload the built
        # installer artifacts so they appear on the Releases page.
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: desktop/src-tauri/target/release/bundle/**
